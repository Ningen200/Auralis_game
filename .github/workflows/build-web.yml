name: Build Auralis Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        run: npm run build:web
      - name: Upload Nitro web build
        uses: actions/upload-artifact@v4
        with:
          name: auralis-web-build
          path: .vercel/output/
          if-no-files-found: error
          retention-days: 14
