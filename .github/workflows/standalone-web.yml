name: Build Auralis Standalone Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone HTML game
        run: npm run build:static
      - name: Upload standalone web package
        uses: actions/upload-artifact@v4
        with:
          name: auralis-standalone-web
          path: web-dist/
          if-no-files-found: error
          retention-days: 14
